# Minimal Mistakes (Jekyll / GitHub Pages)
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# CSSは圧縮して配信（GitHub Pagesでも有効）
sass:
  style: compressed

locale: "ja"
timezone: "Asia/Tokyo"
title: "とやま市民開発部"
subtitle: "UDC 2026 富山県ブロック / Code for Toyama"
description: "じぶんたちでアプリをつくろう in 富山。身の回りの疑問・困りごとをアプリで解決。はじめて歓迎。市民開発者を増やす集まり。"
# 公開先: https://codefortoyama.github.io/udc2026/
url: "https://codefortoyama.github.io"
baseurl: "/udc2026"

repository: "codefortoyama/udc2026"
author:
  name: "Code for Toyama"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: false
      toc: true
      toc_label: "目次"

# Minimal Mistakes skin
minimal_mistakes_skin: "default"

# Google Analytics (GA4) — 全ページ共通
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-0SFK86LPGH"
