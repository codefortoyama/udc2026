# Minimal Mistakes (Jekyll / GitHub Pages)
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

locale: "ja"
timezone: "Asia/Tokyo"
title: "じぶんたちでアプリをつくろう in 富山"
subtitle: "UDC2026 富山ブロック / Code for Toyama"
description: "身の回りの疑問・困りごとをアプリで解決。はじめて歓迎。毎週オンラインもくもく＋月1対面ハンズオン。"
# 公開先: https://codefortoyama.github.io/udc2026/
url: "https://codefortoyama.github.io"
baseurl: "/udc2026"

repository: "codefortoyama/udc2026"
author:
  name: "Code for Toyama"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: false
      toc: true

# Minimal Mistakes skin
minimal_mistakes_skin: "default"
